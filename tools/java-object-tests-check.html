<!doctype html><html lang="pl"><meta charset="utf-8"><title>Testy obiektów Java</title>
<h1>Testy klas i obiektów Java w TeaVM</h1>
<label>Zadanie <select id="task"></select></label>
<button id="run">Sprawdź rozwiązanie referencyjne</button>
<button id="fake">Sprawdź samo println</button>
<button id="all">Sprawdź wszystkie zadania OOP</button>
<pre id="result">Czeka.</pre>
<script type="module">
import {allLessons} from '/src/data/curriculum.js';
import {buildTaskCheckRequest,evaluateTaskCheck} from '/src/services/taskExecution.js';
import {createTeaVMRunner} from '/src/services/teavmRunner.js';
const runner=createTeaVMRunner({timeoutMs:120000});
const tasks=allLessons.flatMap(l=>l.tasks).filter(t=>t.assertionChecks),select=document.querySelector('#task'),result=document.querySelector('#result');
for(const task of tasks)select.add(new Option(task.id+' · '+task.title,task.id));
select.value='inheritance-09-task';
async function run(fake=false,all=false) {
 const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);result.textContent='Kompiluję testy Java w przeglądarce…\n';
 try {
  for(const task of all?tasks:[tasks.find(t=>t.id===select.value)]) {
   const fakeMain='public class Main {public static void main(String[] args) {'+task.outputChecks[0].values.map(value=>'System.out.println('+JSON.stringify(value)+');').join('')+'}}';
   const files=fake?{'Main.java':fakeMain}:task.solutionFiles;
   const response=await runner.run(buildTaskCheckRequest(task,files));
   const report=evaluateTaskCheck(task,files,{...response,error:response.error||response.diagnostics?.map(d=>d.message).join('\n')});
   result.textContent+=(report.passed?'PASS ':'FAIL ')+task.id+'\n'+report.results.map(r=>(r.passed?'✓ ':'✗ ')+r.label+': '+r.detail).join('\n')+'\n';
   if(fake&&report.passed)throw Error('Samo println nie powinno zaliczać tego zadania.');
   if(!fake&&!report.passed)throw Error('Rozwiązanie referencyjne nie przeszło testów.');
  }
  result.textContent+=fake?'PASS: samo println odrzucone.\n':all?'PASS: wszystkie '+tasks.length+' rozwiązania przeszły testy.\n':'PASS: rozwiązanie sprawdzone.\n';
 }catch(error){result.textContent+='BŁĄD: '+error.message;}
 finally{buttons.forEach(b=>b.disabled=false);}
}
document.querySelector('#run').onclick=()=>run();
document.querySelector('#fake').onclick=()=>run(true);
document.querySelector('#all').onclick=()=>run(false,true);
window.addEventListener('pagehide',()=>runner.dispose());
</script></html>
