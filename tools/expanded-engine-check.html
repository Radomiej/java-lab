<!doctype html><html lang="pl"><meta charset="utf-8"><title>Rozszerzony silnik Java</title>
<h1>Test silnika w TeaVM</h1><button id="run">Uruchom kontrakt silnika</button><pre id="result">Czeka.</pre>
<script type="module">
import {expandedEngineContract} from './expanded-engine-contract.js';
import {reviewEngineContract} from './review-engine-contract.js';
import {gameEngineRuntimeFiles} from '/src/data/gameEngineRuntime.js';
import {createTeaVMRunner} from '/src/services/teavmRunner.js';
const runner=createTeaVMRunner(),button=document.querySelector('#run'),result=document.querySelector('#result');
button.onclick=async()=>{button.disabled=true;result.textContent='Kompiluję i uruchamiam Java → TeaVM → WASM…';
 try {const response=await runner.run({files:{...gameEngineRuntimeFiles,'EngineTests.java':expandedEngineContract,'ReviewTests.java':reviewEngineContract,'ContractMain.java':'public class ContractMain { public static void main(String[] args) { EngineTests.main(args); ReviewTests.main(args); } }'},mainClass:'ContractMain',mode:'console'});
 result.textContent=response.ok?response.output:'BŁĄD: '+(response.error||JSON.stringify(response.diagnostics));}
 catch(error){result.textContent='BŁĄD: '+error.message;} finally{button.disabled=false;}};
window.addEventListener('pagehide',()=>runner.dispose());
</script></html>
